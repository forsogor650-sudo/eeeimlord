name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'KOD_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SuperCamera"
          include(":app")
          KOD_EOF
          cat > build.gradle.kts <<'KOD_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KOD_EOF
          cat > gradle.properties <<'KOD_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          kotlin.code.style=official
          KOD_EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'KOD_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.supercamera"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.supercamera"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val camerax = "1.3.4"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
              implementation("androidx.camera:camera-video:$camerax")
              implementation("androidx.camera:camera-view:$camerax")
          }
          KOD_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KOD_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:label="Super Camera"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KOD_EOF
          mkdir -p app/src/main/java/com/example/supercamera
          cat > app/src/main/java/com/example/supercamera/MainActivity.kt <<'KOD_EOF'
          package com.example.supercamera

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CaptureRequest
          import android.os.Build
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.camera.camera2.interop.Camera2CameraControl
          import androidx.camera.camera2.interop.Camera2CameraInfo
          import androidx.camera.camera2.interop.CaptureRequestOptions
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.MediaStoreOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Locale

          /** Сетка «правило третей» поверх превью. */
          class GridView(context: Context) : View(context) {
              private val paint = Paint().apply {
                  color = Color.argb(170, 255, 255, 255)
                  strokeWidth = 2f
                  isAntiAlias = true
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  for (i in 1..2) {
                      canvas.drawLine(w * i / 3f, 0f, w * i / 3f, h, paint)
                      canvas.drawLine(0f, h * i / 3f, w, h * i / 3f, paint)
                  }
              }
          }

          class MainActivity : ComponentActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var gridView: GridView
              private lateinit var countdownText: TextView
              private lateinit var infoText: TextView
              private lateinit var seekA: SeekBar
              private lateinit var seekB: SeekBar

              private lateinit var shutterBtn: Button
              private lateinit var modeBtn: Button
              private lateinit var flashBtn: Button
              private lateinit var flipBtn: Button
              private lateinit var gridBtn: Button
              private lateinit var timerBtn: Button
              private lateinit var manualBtn: Button

              private var provider: ProcessCameraProvider? = null
              private var camera: Camera? = null
              private var imageCapture: ImageCapture? = null
              private var videoCapture: VideoCapture<Recorder>? = null
              private var recording: Recording? = null
              private var countdown: CountDownTimer? = null

              private var lensFacing = CameraSelector.LENS_FACING_BACK
              private var flashMode = ImageCapture.FLASH_MODE_OFF
              private var videoMode = false

              private var gridOn = false
              private var timerSeconds = 0
              private var manualMode = false
              private var evProgress = 50
              private var isoProgress = 30
              private var shutterProgress = 50
              private var updatingSeek = false

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { result ->
                      if (result[Manifest.permission.CAMERA] == true) {
                          startCamera()
                      } else {
                          toast("Нужен доступ к камере")
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUi()
                  permissionLauncher.launch(
                      arrayOf(Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO)
                  )
              }

              // ---------- UI (без XML, всё в коде) ----------

              @SuppressLint("ClickableViewAccessibility")
              private fun buildUi() {
                  val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  val match = ViewGroup.LayoutParams.MATCH_PARENT
                  val wrap = ViewGroup.LayoutParams.WRAP_CONTENT

                  previewView = PreviewView(this).apply {
                      scaleType = PreviewView.ScaleType.FIT_CENTER
                  }
                  root.addView(previewView, FrameLayout.LayoutParams(match, match))

                  gridView = GridView(this).apply { visibility = View.GONE }
                  root.addView(gridView, FrameLayout.LayoutParams(match, match))

                  countdownText = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 96f
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                  }
                  root.addView(countdownText, FrameLayout.LayoutParams(match, match))

                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#66000000"))
                      setPadding(dp(8), dp(8), dp(8), dp(24))
                  }

                  infoText = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      gravity = Gravity.CENTER
                  }
                  seekA = SeekBar(this).apply { max = 100; progress = evProgress }
                  seekB = SeekBar(this).apply {
                      max = 100
                      progress = shutterProgress
                      visibility = View.GONE
                  }

                  seekA.setOnSeekBarChangeListener(seekListener { p ->
                      if (manualMode) isoProgress = p else evProgress = p
                      applyExposure()
                  })
                  seekB.setOnSeekBarChangeListener(seekListener { p ->
                      shutterProgress = p
                      applyExposure()
                  })

                  gridBtn = makeButton("Сетка: выкл") { toggleGrid() }
                  timerBtn = makeButton("Таймер: выкл") { cycleTimer() }
                  manualBtn = makeButton("Экспозиция: авто") { toggleManual() }

                  flashBtn = makeButton("Вспышка: выкл") { cycleFlash() }
                  shutterBtn = makeButton("Снимок") { onShutter() }
                  modeBtn = makeButton("Режим: фото") { toggleMode() }
                  flipBtn = makeButton("Камера ⟲") { flipCamera() }

                  val row2 = makeRow(listOf(gridBtn, timerBtn, manualBtn))
                  val row1 = makeRow(listOf(flashBtn, shutterBtn, modeBtn, flipBtn))

                  panel.addView(infoText, LinearLayout.LayoutParams(match, wrap))
                  panel.addView(seekA, LinearLayout.LayoutParams(match, wrap))
                  panel.addView(seekB, LinearLayout.LayoutParams(match, wrap))
                  panel.addView(row2, LinearLayout.LayoutParams(match, wrap))
                  panel.addView(row1, LinearLayout.LayoutParams(match, wrap))

                  root.addView(panel, FrameLayout.LayoutParams(match, wrap, Gravity.BOTTOM))
                  setContentView(root)

                  // Зум щипком и фокус касанием
                  val scaleDetector = ScaleGestureDetector(
                      this,
                      object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                          override fun onScale(detector: ScaleGestureDetector): Boolean {
                              val cam = camera ?: return true
                              val state = cam.cameraInfo.zoomState.value ?: return true
                              val newZoom = (state.zoomRatio * detector.scaleFactor)
                                  .coerceIn(state.minZoomRatio, state.maxZoomRatio)
                              cam.cameraControl.setZoomRatio(newZoom)
                              return true
                          }
                      })

                  previewView.setOnTouchListener { v, e ->
                      scaleDetector.onTouchEvent(e)
                      if (e.action == MotionEvent.ACTION_UP &&
                          !scaleDetector.isInProgress &&
                          e.eventTime - e.downTime < 300
                      ) {
                          val point = previewView.meteringPointFactory.createPoint(e.x, e.y)
                          camera?.cameraControl?.startFocusAndMetering(
                              FocusMeteringAction.Builder(point).build()
                          )
                          v.performClick()
                      }
                      true
                  }

                  updateUi()
              }

              private fun makeRow(buttons: List<Button>): LinearLayout {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                  }
                  buttons.forEach {
                      row.addView(
                          it,
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      )
                  }
                  return row
              }

              private fun seekListener(onChange: (Int) -> Unit) =
                  object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (!updatingSeek) onChange(progress)
                      }

                      override fun onStartTrackingTouch(bar: SeekBar?) {}
                      override fun onStopTrackingTouch(bar: SeekBar?) {}
                  }

              private fun makeButton(text: String, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  textSize = 11f
                  isAllCaps = false
                  setOnClickListener { onClick() }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

              private fun updateUi() {
                  flashBtn.text = when {
                      videoMode -> if (flashMode == ImageCapture.FLASH_MODE_ON) "Фонарь: вкл" else "Фонарь: выкл"
                      flashMode == ImageCapture.FLASH_MODE_ON -> "Вспышка: вкл"
                      flashMode == ImageCapture.FLASH_MODE_AUTO -> "Вспышка: авто"
                      else -> "Вспышка: выкл"
                  }
                  modeBtn.text = if (videoMode) "Режим: видео" else "Режим: фото"
                  shutterBtn.text = when {
                      countdown != null -> "Отмена"
                      !videoMode -> "Снимок"
                      recording != null -> "Стоп"
                      else -> "Запись"
                  }
                  shutterBtn.setTextColor(if (recording != null) Color.RED else Color.BLACK)
                  modeBtn.isEnabled = recording == null && countdown == null
                  flipBtn.isEnabled = recording == null && countdown == null

                  gridBtn.text = if (gridOn) "Сетка: вкл" else "Сетка: выкл"
                  gridView.visibility = if (gridOn) View.VISIBLE else View.GONE
                  timerBtn.text = if (timerSeconds == 0) "Таймер: выкл" else "Таймер: $timerSeconds с"
                  manualBtn.text = if (manualMode) "Экспозиция: ручная" else "Экспозиция: авто"
                  seekB.visibility = if (manualMode) View.VISIBLE else View.GONE
              }

              // ---------- Сетка, таймер, экспозиция ----------

              private fun toggleGrid() {
                  gridOn = !gridOn
                  updateUi()
              }

              private fun cycleTimer() {
                  timerSeconds = when (timerSeconds) {
                      0 -> 3
                      3 -> 10
                      else -> 0
                  }
                  updateUi()
              }

              private fun toggleManual() {
                  manualMode = !manualMode
                  setSeekProgress()
                  applyExposure()
                  updateUi()
              }

              private fun setSeekProgress() {
                  updatingSeek = true
                  seekA.progress = if (manualMode) isoProgress else evProgress
                  seekB.progress = shutterProgress
                  updatingSeek = false
              }

              private fun formatShutter(ns: Long): String {
                  val denom = Math.round(1_000_000_000.0 / ns)
                  return if (denom <= 1L) "1 с" else "1/$denom"
              }

              private fun applyExposure() {
                  val cam = camera ?: return
                  val c2 = Camera2CameraControl.from(cam.cameraControl)

                  if (manualMode) {
                      val info = Camera2CameraInfo.from(cam.cameraInfo)
                      val isoRange =
                          info.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE)
                      val expRange =
                          info.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_EXPOSURE_TIME_RANGE)
                      if (isoRange == null || expRange == null) {
                          toast("Ручной режим не поддерживается этой камерой")
                          manualMode = false
                          setSeekProgress()
                          applyExposure()
                          updateUi()
                          return
                      }
                      val iso = isoRange.lower + (isoRange.upper - isoRange.lower) * isoProgress / 100
                      val lo = maxOf(expRange.lower, 125_000L).toDouble()
                      val hi = maxOf(minOf(expRange.upper, 250_000_000L).toDouble(), lo)
                      val ns = (lo * Math.pow(hi / lo, shutterProgress / 100.0)).toLong()

                      c2.setCaptureRequestOptions(
                          CaptureRequestOptions.Builder()
                              .setCaptureRequestOption(
                                  CaptureRequest.CONTROL_AE_MODE,
                                  CaptureRequest.CONTROL_AE_MODE_OFF
                              )
                              .setCaptureRequestOption(CaptureRequest.SENSOR_SENSITIVITY, iso)
                              .setCaptureRequestOption(CaptureRequest.SENSOR_EXPOSURE_TIME, ns)
                              .build()
                      )
                      infoText.text = "ISO $iso · выдержка ${formatShutter(ns)}"
                  } else {
                      c2.clearCaptureRequestOptions()
                      val st = cam.cameraInfo.exposureState
                      if (!st.isExposureCompensationSupported) {
                          infoText.text = "Яркость: авто"
                          return
                      }
                      val r = st.exposureCompensationRange
                      val idx = r.lower + (r.upper - r.lower) * evProgress / 100
                      cam.cameraControl.setExposureCompensationIndex(idx)
                      val ev = idx * st.exposureCompensationStep.toFloat()
                      infoText.text = "Яркость (EV): " + String.format(Locale.US, "%+.1f", ev)
                  }
              }

              // ---------- Камера ----------

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      provider = future.get()
                      bindUseCases()
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun bindUseCases() {
                  val p = provider ?: return
                  p.unbindAll()

                  val selector = CameraSelector.Builder().requireLensFacing(lensFacing).build()
                  val preview = Preview.Builder().build().also {
                      it.setSurfaceProvider(previewView.surfaceProvider)
                  }

                  try {
                      camera = if (videoMode) {
                          val recorder = Recorder.Builder()
                              .setQualitySelector(QualitySelector.from(Quality.HIGHEST))
                              .build()
                          videoCapture = VideoCapture.withOutput(recorder)
                          imageCapture = null
                          p.bindToLifecycle(this, selector, preview, videoCapture)
                      } else {
                          imageCapture = ImageCapture.Builder()
                              .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                              .setFlashMode(flashMode)
                              .build()
                          videoCapture = null
                          p.bindToLifecycle(this, selector, preview, imageCapture)
                      }
                      if (videoMode) {
                          camera?.cameraControl?.enableTorch(flashMode == ImageCapture.FLASH_MODE_ON)
                      }
                      applyExposure()
                  } catch (e: Exception) {
                      toast("Не удалось запустить камеру: ${e.message}")
                  }
                  updateUi()
              }

              private fun cycleFlash() {
                  flashMode = if (videoMode) {
                      if (flashMode == ImageCapture.FLASH_MODE_ON) ImageCapture.FLASH_MODE_OFF
                      else ImageCapture.FLASH_MODE_ON
                  } else {
                      when (flashMode) {
                          ImageCapture.FLASH_MODE_OFF -> ImageCapture.FLASH_MODE_ON
                          ImageCapture.FLASH_MODE_ON -> ImageCapture.FLASH_MODE_AUTO
                          else -> ImageCapture.FLASH_MODE_OFF
                      }
                  }
                  imageCapture?.flashMode = flashMode
                  if (videoMode) camera?.cameraControl?.enableTorch(flashMode == ImageCapture.FLASH_MODE_ON)
                  updateUi()
              }

              private fun toggleMode() {
                  videoMode = !videoMode
                  flashMode = ImageCapture.FLASH_MODE_OFF
                  bindUseCases()
              }

              private fun flipCamera() {
                  lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK)
                      CameraSelector.LENS_FACING_FRONT else CameraSelector.LENS_FACING_BACK
                  bindUseCases()
              }

              private fun onShutter() {
                  // Повторное нажатие во время отсчёта отменяет таймер
                  if (countdown != null) {
                      countdown?.cancel()
                      countdown = null
                      countdownText.visibility = View.GONE
                      updateUi()
                      return
                  }
                  // Остановка записи всегда сразу
                  if (videoMode && recording != null) {
                      toggleRecording()
                      return
                  }
                  if (timerSeconds > 0) startCountdown() else doCapture()
              }

              private fun startCountdown() {
                  countdownText.visibility = View.VISIBLE
                  countdown = object : CountDownTimer(timerSeconds * 1000L, 1000L) {
                      override fun onTick(ms: Long) {
                          countdownText.text = ((ms + 999L) / 1000L).toString()
                      }

                      override fun onFinish() {
                          countdownText.visibility = View.GONE
                          countdown = null
                          doCapture()
                      }
                  }.start()
                  updateUi()
              }

              private fun doCapture() {
                  if (videoMode) toggleRecording() else takePhoto()
              }

              private fun timestamp() =
                  SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())

              // ---------- Фото ----------

              private fun takePhoto() {
                  val ic = imageCapture ?: return
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, "IMG_${timestamp()}")
                      put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT > Build.VERSION_CODES.P) {
                          put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/SuperCamera")
                      }
                  }
                  val options = ImageCapture.OutputFileOptions.Builder(
                      contentResolver,
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      values
                  ).build()

                  ic.takePicture(
                      options,
                      ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onImageSaved(output: ImageCapture.OutputFileResults) {
                              toast("Фото сохранено в галерею")
                          }

                          override fun onError(e: ImageCaptureException) {
                              toast("Ошибка съёмки: ${e.message}")
                          }
                      })
              }

              // ---------- Видео ----------

              @SuppressLint("MissingPermission")
              private fun toggleRecording() {
                  val vc = videoCapture ?: return

                  val current = recording
                  if (current != null) {
                      current.stop()
                      return
                  }

                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, "VID_${timestamp()}")
                      put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                      if (Build.VERSION.SDK_INT > Build.VERSION_CODES.P) {
                          put(MediaStore.MediaColumns.RELATIVE_PATH, "Movies/SuperCamera")
                      }
                  }
                  val output = MediaStoreOutputOptions.Builder(
                      contentResolver,
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  ).setContentValues(values).build()

                  var pending = vc.output.prepareRecording(this, output)
                  val hasAudio = ContextCompat.checkSelfPermission(
                      this, Manifest.permission.RECORD_AUDIO
                  ) == PackageManager.PERMISSION_GRANTED
                  if (hasAudio) pending = pending.withAudioEnabled()

                  recording = pending.start(ContextCompat.getMainExecutor(this)) { event ->
                      if (event is VideoRecordEvent.Finalize) {
                          recording = null
                          if (event.hasError()) toast("Ошибка записи видео")
                          else toast("Видео сохранено в галерею")
                          updateUi()
                      }
                  }
                  updateUi()
              }

              override fun onDestroy() {
                  countdown?.cancel()
                  recording?.stop()
                  super.onDestroy()
              }
          }
          KOD_EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SuperCamera-APK
          path: app/build/outputs/apk/debug/app-debug.apk
